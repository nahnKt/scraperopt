name: Daily sync

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t optibot-sync .

      - name: Run sync job
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VECTOR_STORE_ID: ${{ secrets.VECTOR_STORE_ID }}
        run: docker run --rm -e OPENAI_API_KEY -e VECTOR_STORE_ID optibot-sync | tee run.log

      - name: Save run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: last-run-log
          path: run.log
